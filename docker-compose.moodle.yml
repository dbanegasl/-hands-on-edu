# Local Moodle 4.5 to test the LTI 1.3 integration end to end (NOT for production).
#
#   docker compose -f docker-compose.yml -f docker-compose.moodle.yml up -d
#   ./scripts/moodle-dev-setup.sh          # registers HandsOnEdu in Moodle and vice versa
#
# Everyone uses the same URLs: *.localtest.me resolves to 127.0.0.1 in public DNS,
# and inside the containers it is mapped to the Docker host, so the browser and
# the servers reach each other through the published ports.
#   HandsOnEdu: http://handsonedu.localtest.me:9876    Moodle: http://moodle.localtest.me:8080
# Guide: docs/onboarding/02-moodle-local.md

services:
  hands-on-edu:
    environment:
      - PUBLIC_BASE_URL=http://handsonedu.localtest.me:${HOST_PORT:-9876}
    extra_hosts:
      - "moodle.localtest.me:host-gateway"

  moodle-db:
    image: bitnamilegacy/mariadb:11.4
    container_name: hoe_moodle_db
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_moodle
      - MARIADB_DATABASE=bitnami_moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - moodle_db:/bitnami/mariadb

  moodle:
    image: bitnamilegacy/moodle:4.5
    container_name: hoe_moodle
    depends_on:
      - moodle-db
    ports:
      - "8080:8080"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - MOODLE_DATABASE_HOST=moodle-db
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_NAME=bitnami_moodle
      - MOODLE_HOST=moodle.localtest.me:8080
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=Admin1234!
      - MOODLE_EMAIL=admin@example.com
      - MOODLE_SITE_NAME=Moodle de prueba HandsOnEdu
      - MOODLE_LANG=es
    extra_hosts:
      - "handsonedu.localtest.me:host-gateway"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata

volumes:
  moodle_db:
  moodle_data:
  moodledata_data:
