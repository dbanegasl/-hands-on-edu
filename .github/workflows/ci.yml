name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        # MediaPipe's HandLandmarker is mocked in tests/conftest.py: no model or camera needed.
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  javascript:
    name: Frontend engine (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in app/static/js/*.js; do node --check "$f"; done
      - name: Gesture parity + sign engine tests
        run: node --test tests/js/*.test.cjs

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t handsonedu:ci .
      - name: Vendored MediaPipe JS present
        run: docker run --rm handsonedu:ci ls /app/vendor/mediapipe/vision_bundle.mjs /app/vendor/mediapipe/wasm/vision_wasm_internal.wasm /app/models/hand_landmarker.task
