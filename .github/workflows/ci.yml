name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # release.yml runs the same checks before publishing an image

permissions:
  contents: read

jobs:
  python:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        # MediaPipe's HandLandmarker is mocked in tests/conftest.py: no model or camera needed.
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  javascript:
    name: Frontend engine (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: for f in app/static/js/*.js; do node --check "$f"; done
      - name: Gesture parity + sign engine tests
        run: node --test tests/js/*.test.cjs
      - name: AI video prompt catalog in sync with catalog.json
        run: python3 scripts/gen_video_prompts.py --check
      - name: APP_VERSION has a CHANGELOG entry
        run: python3 scripts/release.py check

  docker:
    name: Docker image + deploy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint deploy scripts
        run: shellcheck deploy/deploy.sh scripts/test-deploy.sh
      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml config -q && rm deploy/.env
      - name: Build
        run: docker build -t handsonedu:ci --build-arg VERSION="$(python3 scripts/release.py version)" --build-arg REVISION="$GITHUB_SHA" .
      - name: Vendored MediaPipe JS present
        run: docker run --rm handsonedu:ci ls /app/vendor/mediapipe/vision_bundle.mjs /app/vendor/mediapipe/wasm/vision_wasm_internal.wasm /app/models/hand_landmarker.task
      - name: No secrets or data baked into the image
        run: docker run --rm --entrypoint sh handsonedu:ci -c 'test ! -e /app/.env && test ! -e /app/.git && test ! -e /app/tests && test -z "$(find /app/data -mindepth 1)"'
      - name: The app does not run as root
        run: test "$(docker run --rm handsonedu:ci id -u)" = 1000
      - name: deploy.sh — install, backup, rollback
        run: scripts/test-deploy.sh handsonedu:ci
